packages:
  - "apps/apps-backend"
  - "apps/core"
  - "apps/evm-bridge"
  - "apps/explorer"
  - "apps/ui-icons"
  - "apps/ui-kit"
  - "apps/wallet"
  - "apps/wallet-dashboard"
  - "dapps/kiosk"
  - "dapps/kiosk-cli"
  - "dapps/multisig-toolkit"
  - "dapps/sponsored-transactions"
  - "docs/site"
  - "sdk/bcs"
  - "sdk/build-scripts"
  - "sdk/create-dapp"
  - "sdk/dapp-kit"
  - "sdk/graphql-transport"
  - "sdk/iota-vault-sdk"
  - "sdk/isc-sdk"
  - "sdk/kiosk"
  - "sdk/ledgerjs-hw-app-iota"
  - "sdk/move-bytecode-template"
  - "sdk/signers"
  - "sdk/typescript"
  - "sdk/wallet-standard"
  - "!**/dist/**"
  - "!**/.next/**"
  - "!sdk/create-dapp/templates/*"
  - "!sdk/typescript/bcs"
  - "!sdk/typescript/client"
  - "!sdk/typescript/cryptography"
  - "!sdk/typescript/faucet"
  - "!sdk/typescript/graphql"
  - "!sdk/typescript/keypairs/ed25519"
  - "!sdk/typescript/keypairs/secp256k1"
  - "!sdk/typescript/keypairs/secp256r1"
  - "!sdk/typescript/keypairs/passkey"
  - "!sdk/typescript/multisig"
  - "!sdk/typescript/signers/ledger"
  - "!sdk/typescript/scripts"
  - "!sdk/typescript/transactions"
  - "!sdk/typescript/utils"
  - "!sdk/typescript/verify"
  - "!sdk/move-bytecode-template/pkg"
  - "!sdk/typescript/graphql/schemas/2025.2"
  - "!sdk/signers/aws"
  - "!sdk/signers/gcp"
  - "!sdk/signers/ledger"
  - "!sdk/signers/webcrypto"
  - "!sdk/typescript/test/**/**"

strictDepBuilds: true
blockExoticSubdeps: true
autoInstallPeers: false
strictPeerDependencies: false
publicHoistPattern:
  - "*storybook*"
pmOnFail: ignore
confirmModulesPurge: false
minimumReleaseAge: 20160
minimumReleaseAgeExclude:
  - "turbo@2.9.14"
  - "@turbo/darwin-64@2.9.14"
  - "@turbo/darwin-arm64@2.9.14"
  - "@turbo/linux-64@2.9.14"
  - "@turbo/linux-arm64@2.9.14"
  - "@turbo/windows-64@2.9.14"
  - "@turbo/windows-arm64@2.9.14"
  - "qs@6.15.2"
  - "tmp@0.2.6"
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 20160

allowBuilds:
  "@biomejs/biome": true
  "@sentry/cli": true
  "@swc/core": true
  "@tailwindcss/oxide": true
  "core-js": true
  "core-js-pure": true
  "cypress": true
  "esbuild": true
  "msw": true
  "protobufjs": true
  "sharp": true
  "unrs-resolver": true

overrides:
  "@noble/curves": "1.9.2"
  "@tanstack/react-query": "5.56.2"
  "@tanstack/react-query-devtools": "5.58.0"
  "@tanstack/react-query-persist-client": "5.56.2"
  "ajv@<7": "6.14.0"
